name: Fetch Encrypted Secrets

on:
  workflow_call:
    inputs:
      zip_url_json:
        required: true
        type: string

permissions:
  contents: read

jobs:
  download-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Download encrypted secrets
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json
          import os
          import time
          import zipfile
          from pathlib import Path

          import requests

          input_data = json.loads('${{ inputs.zip_url_json }}')
          asset_id = str(input_data.get('github_release_asset_id', '')).strip()
          if asset_id:
              url = f"https://api.github.com/repos/${{ github.repository }}/releases/assets/{asset_id}"
              headers = {
                  'Accept': 'application/octet-stream',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'User-Agent': 'Smartia-RDGen-Secrets/2.0',
              }
              source_name = 'private GitHub release asset'
          else:
              url = f"{input_data['url']}/get_zip?filename={input_data['file']}"
              headers = {'User-Agent': 'Smartia-RDGen-Secrets/2.0'}
              source_name = 'legacy RDGen endpoint'

          destination = Path('secrets.zip')
          last_error = None
          for attempt in range(1, 7):
              temporary = destination.with_suffix('.zip.part')
              try:
                  print(f"Downloading encrypted secrets from {source_name} (attempt {attempt}/6)...")
                  response = requests.get(url, timeout=(15, 90), headers=headers)
                  response.raise_for_status()
                  if len(response.content) < 64:
                      raise RuntimeError('Downloaded secrets archive is unexpectedly small')
                  temporary.write_bytes(response.content)
                  if not zipfile.is_zipfile(temporary):
                      raise RuntimeError('Downloaded secrets payload is not a ZIP archive')
                  temporary.replace(destination)
                  print('Encrypted secrets archive verified.')
                  break
              except Exception as exc:
                  last_error = exc
                  temporary.unlink(missing_ok=True)
                  if attempt == 6:
                      raise
                  delay = min(30, 3 * attempt)
                  print(f"Attempt {attempt} failed: {exc}; retrying in {delay}s")
                  time.sleep(delay)
          if not destination.is_file():
              raise RuntimeError(f'Unable to download encrypted secrets: {last_error}')
      - name: Upload Encrypted Artifact
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-secrets-zip
          path: secrets.zip
          retention-days: 1